name: cytometry_env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - r-base>=4.3
  - r-devtools
  - r-remotes
  - r-biocmanager
  - r-cairo
  - r-mclust
  - r-scales
  - r-tibble
  - r-ggplot2
  - r-openxlsx
  - r-viridis
  - r-plotly
  - r-data.table
  - r-ggrepel
  - r-janitor
  - r-rmarkdown
  - r-rcolorbrewer
  - r-dplyr
  - r-reshape2
  - r-rtsne
  - r-diptest
  - r-laplacesdemon
  - r-ggpubr
  - r-units
  - r-mousetrap
  - r-readxl
  - r-magrittr
  - r-ggridges
  - r-emdist
  - r-plyr
  - r-matrix
  - r-irlba
  - r-rspectra
  - r-bigstatsr
  - r-multimode
  # r-sbic # Not consistently available, install via R if needed
  - r-tidyverse
  - r-lme4
  - r-lmertest
  - r-emmeans
  - r-future
  - r-future.apply
  - r-progress
  - r-optparse     # CLI arg parsing (nextflow/bin/*_cli.R, scripts/umap_from_flowjo.R)
  - r-ragg         # PNG device with reliable font rendering (save_plot_formats)
  - r-svglite      # SVG device that honours the registered font (save_plot_formats)
  - r-systemfonts  # Font discovery/registration for the ragg/svglite devices

  # Bioconductor Packages (bioconductor- prefix)
  - bioconductor-opencyto
  - bioconductor-cytoml      # FlowJo .wsp parsing (open_flowjo_xml, flowjo_to_gatingset)
  - bioconductor-flowcore
  - bioconductor-flowai
  - bioconductor-peacoqc
  - bioconductor-flowworkspace
  - bioconductor-flowworkspacedata
  - r-uwot
  - r-pheatmap
  # - bioconductor-ggcyto # Sometimes tricky, usually available
  - bioconductor-flowvs
  - bioconductor-preprocesscore
  - bioconductor-flowtrans
  - bioconductor-biobase
  - bioconductor-biocgenerics
  - bioconductor-biocparallel
  - bioconductor-cytolib
  - bioconductor-flowsom

  # System dependencies (Linux/macOS only — Windows users need Rtools instead)
  - pkg-config    # [linux,osx]
  - make          # [linux,osx]
  - gcc           # [linux,osx]
  - gxx           # [linux,osx]
  - libxml2       # [linux,osx]
  - libpng        # [linux,osx]
  - libjpeg-turbo # [linux,osx]
  # Windows users: install Rtools from https://cran.r-project.org/bin/windows/Rtools/

  # --- Dash front-end (app/) -------------------------------------------------
  # Only needed to run the FlowJo->UMAP GUI; the pipeline and the standalone
  # scripts do not import any of this. Python lives in the SAME environment so
  # the app can call `Rscript` directly with no cross-environment plumbing.
  # dash-mantine-components is not packaged on conda-forge, so the three Dash
  # packages come from pip — keeping the conda solve as small as possible.
  - python>=3.10
  - pip
  - pip:
      - dash>=3.0
      - dash-mantine-components>=2.0
      - dash-iconify
      - gunicorn        # WSGI server used by app/run.sh (single worker)
