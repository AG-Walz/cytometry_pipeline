name: cytometry_env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - r-base>=4.3
  - r-devtools
  - r-remotes
  - r-biocmanager
  - r-cairo
  - r-mclust
  - r-scales
  - r-tibble
  - r-ggplot2
  - r-openxlsx
  - r-viridis
  - r-plotly
  - r-data.table
  - r-ggrepel
  - r-janitor
  - r-rmarkdown
  - r-rcolorbrewer
  - r-dplyr
  - r-reshape2
  - r-rtsne
  - r-diptest
  - r-laplacesdemon
  - r-ggpubr
  - r-units
  - r-mousetrap
  - r-readxl
  - r-magrittr
  - r-ggridges
  - r-emdist
  - r-plyr
  - r-matrix
  - r-irlba
